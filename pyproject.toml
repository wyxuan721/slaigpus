[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slaigpus"
version = "0.7.0"
description = "Manage a SenseCore CCI directly or through optional SSH SOCKS with snapshot-based renewal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
automation = ["playwright>=1.40"]

[project.scripts]
slaigpus = "slaigpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
